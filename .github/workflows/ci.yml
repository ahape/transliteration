name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt pytest
      - name: Test
        run: pytest -q

  package:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Zip runtime files
        run: python scripts/deploy.py package
      - uses: actions/upload-artifact@v4
        with:
          name: transliteration
          path: dist/*.zip
      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --generate-notes --title "$GITHUB_REF_NAME"

  deploy:
    needs: package
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install requests
      - name: Upload to PythonAnywhere and reload
        env:
          API_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
          PYTHONANYWHERE_USERNAME: ${{ secrets.PYTHONANYWHERE_USERNAME }}
          PYTHONANYWHERE_DOMAIN: ${{ secrets.PYTHONANYWHERE_DOMAIN || vars.PYTHONANYWHERE_DOMAIN }}
          PYTHONANYWHERE_SITE: ${{ vars.PYTHONANYWHERE_SITE }}
          PYTHONANYWHERE_PROJECT_DIR: ${{ vars.PYTHONANYWHERE_PROJECT_DIR }}
          PYTHONANYWHERE_VENV: ${{ vars.PYTHONANYWHERE_VENV }}
          PYTHONANYWHERE_PYTHON: ${{ vars.PYTHONANYWHERE_PYTHON }}
        run: python scripts/deploy.py pythonanywhere
