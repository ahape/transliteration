<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Transliteration Game</title>
    <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" sizes="32x32">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  </head>
  <body>
    <div class="frame">
      <header class="top">
        <a class="ver" href="https://github.com/ahape/transliteration/releases/tag/v{{ version }}">v{{ version }}</a>
        <select id="lang" aria-label="Alphabet">
          {% for plugin in plugins %}
          <optgroup label="{{ plugin.label }}">
            {% for code, (name, _) in plugin.flavors.items() %}
            <option value="{{ code }}">{{ name }}</option>
            {% endfor %}
          </optgroup>
          {% endfor %}
        </select>
      </header>

      <p id="date" class="date"></p>
      <p id="tagline" class="tagline">{{ tagline }}</p>

      <main>
        <p id="cipher" class="cipher" lang="ru"></p>
        <form id="guess-form">
          <input id="guess" type="text" maxlength="10" autocomplete="off" autocapitalize="none" spellcheck="false" aria-label="English word">
          <button type="submit" id="primary">Submit</button>
        </form>
        <p id="progress" class="progress"></p>
        <p id="status" class="status" aria-live="polite"></p>
        <div id="score" class="score" hidden></div>
        <ul id="revealed" class="revealed" hidden></ul>
      </main>
    </div>

    <aside id="rubric" class="rubric" aria-label="Letter rubric">
      <h2>Rubric</h2>
      <ul id="rubric-list"></ul>
    </aside>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
  </body>
</html>
